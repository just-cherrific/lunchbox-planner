name: Daily Vercel refresh

on:
  schedule:
    # 00:05 Hong Kong time (UTC+8)
    - cron: "5 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run daily-update
      - name: Commit daily refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/daily-status.json
          git diff --cached --quiet || git commit -m "chore: daily calendar refresh"
          git push
